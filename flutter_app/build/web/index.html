<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nivora — 10-minute grocery delivery with AUREV AI payment protection">
  
  <!-- Mobile App Viewport Constraints (No Pinch-Zoom, No Text Selection Glitches) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#167244">
  
  <!-- Apple Web App Capable -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nivora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nivora — 10-Min Groceries</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F172A;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* App Container for Desktop / Tablet (Phone Frame Centered) */
    @media (min-width: 600px) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #090E17 radial-gradient(circle at center, #1E293B 0%, #090E17 100%);
      }
      #flutter_host {
        width: 100%;
        max-width: 430px;
        height: 100vh;
        max-height: 920px;
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
        overflow: hidden;
        position: relative;
        background: #F5F7FA;
      }
    }

    @media (max-width: 599px) {
      #flutter_host {
        width: 100vw;
        height: 100vh;
        position: relative;
        background: #F5F7FA;
      }
    }

    /* App Launch Splash */
    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #167244;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      animation: pulse 1.6s infinite ease-in-out;
    }
    .splash-title {
      color: white;
      font-size: 28px;
      font-weight: 800;
      margin-top: 18px;
      letter-spacing: -0.5px;
    }
    .splash-sub {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      margin-top: 6px;
      font-weight: 500;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); }
      50% { transform: scale(1.04); }
      100% { transform: scale(0.96); }
    }
  </style>
</head>
<body>
  <div id="flutter_host">
    <div id="splash">
      <div class="splash-logo">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="#167244">
          <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-9 8z"/>
        </svg>
      </div>
      <div class="splash-title">Nivora</div>
      <div class="splash-sub">10-Minute Grocery Delivery</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
